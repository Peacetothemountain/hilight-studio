name: Sync Upstream

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Upstream changes land through a reviewed pull request so the Android checks run on them,
      # instead of being merged and pushed straight to main.
      - name: Open or refresh the upstream sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/DhananjayBhosale/hilight-studio.git || true
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "main already contains upstream/main"
            exit 0
          fi
          git checkout -B sync/upstream origin/main
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::warning::upstream/main conflicts with main; merge it by hand"
            exit 0
          fi
          git push --force-with-lease origin sync/upstream
          if [ -z "$(gh pr list --head sync/upstream --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head sync/upstream \
              --title "Sync upstream DhananjayBhosale/hilight-studio" \
              --body "Automated merge of upstream/main. Review and let the Android checks pass before merging."
          fi
