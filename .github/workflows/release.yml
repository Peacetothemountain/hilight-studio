name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The secrets context is not available in step `if:` expressions; expose only whether a
      # keystore exists, never its contents.
      HAS_KEYSTORE: ${{ secrets.HILIGHT_STORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Require signing material for tagged releases
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "HILIGHT_STORE_BASE64 is not configured; refusing to publish an unsigned release." >&2
          exit 1
      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HILIGHT_STORE_BASE64: ${{ secrets.HILIGHT_STORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$HILIGHT_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "HILIGHT_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build release APK
        env:
          HILIGHT_STORE_PASSWORD: ${{ secrets.HILIGHT_STORE_PASSWORD }}
          HILIGHT_KEY_ALIAS: ${{ secrets.HILIGHT_KEY_ALIAS }}
          HILIGHT_KEY_PASSWORD: ${{ secrets.HILIGHT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify release signature
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "signed release APK was not produced" >&2; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
