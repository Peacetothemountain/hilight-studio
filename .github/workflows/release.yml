name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Decode Release Keystore
        if: ${{ secrets.HILIGHT_STORE_BASE64 != '' }}
        env:
          HILIGHT_STORE_BASE64: ${{ secrets.HILIGHT_STORE_BASE64 }}
        run: |
          printf '%s' "$HILIGHT_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "HILIGHT_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build Release APK
        env:
          HILIGHT_STORE_PASSWORD: ${{ secrets.HILIGHT_STORE_PASSWORD }}
          HILIGHT_KEY_ALIAS: ${{ secrets.HILIGHT_KEY_ALIAS }}
          HILIGHT_KEY_PASSWORD: ${{ secrets.HILIGHT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
